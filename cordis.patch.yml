# dsh-model-deploy bundle patch：通过 dsh-mcp-client 把 model-deploy MCP 服务插入 profile。
#
# 不用裸命令名 `dsh-model-deploy-mcp`：harness 的 PATH 不包含 profile 的
# node_modules/.bin，会 spawn ENOENT。改为用 harness 自身的 node 直接运行
# 已安装包内 lib/server.js 的绝对路径（在 DSH_HOME/profiles/*/node_modules 下查找）。
- insert:
    - id: dsh-model-deploy-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: model-deploy
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(() => { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const root = dshHomePath('profiles'); for (const name of fs.readdirSync(root)) { const file = path.join(root, name, 'node_modules', 'dsh-model-deploy', 'lib', 'server.js'); if (fs.existsSync(file)) return fs.realpathSync(file) } throw new Error('dsh-model-deploy: lib/server.js not found under ' + root) })()"
        env: {}
        failOnStartupError: false
        toolCallTimeoutMs: 600000
